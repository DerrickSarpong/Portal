[package]
name = "portal"
version = "0.1.0"
description = "Portal — a Windows take on the macOS Blink dev-server utility: tray-resident monitor for local dev servers and Android emulators."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Process tree traversal (parent chains, kill).
sysinfo = "0.32"

# Async helpers for the poller + Android CLI commands (Tauri's runtime is tokio).
tokio = { version = "1", features = ["process", "time", "sync"] }

# Win32: TCP tables, PEB reads, process creation, registry autostart.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
